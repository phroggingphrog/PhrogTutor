[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-tracking"
version = "0.1.0"
description = "A project-aware learning planner"
requires-python = ">=3.11"
dependencies = [
    "fsrs>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["learning_tracking", "learning_tracking.*"]

[project.scripts]
learning-tracking = "learning_tracking.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
